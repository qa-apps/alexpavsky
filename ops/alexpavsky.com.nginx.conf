server {
    listen 80;
    listen [::]:80;
    server_name alexpavsky.com www.alexpavsky.com;

    location ^~ /.well-known/acme-challenge/ {
        allow all;
        default_type "text/plain";
        root /var/www/alexpavsky.com/html;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name alexpavsky.com www.alexpavsky.com;
    root /var/www/alexpavsky.com/html;
    index index.html;
    autoindex off;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/alexpavsky.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alexpavsky.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # cdnjs.cloudflare.com in script-src is required for pdf.js + mammoth.js,
    # which parse PDF and DOCX uploads in the chatbot. Without it, those
    # attachment types fail silently at the client.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://cdnjs.cloudflare.com https://fonts.gstatic.com; connect-src 'self' https:; frame-src https://www.youtube.com https://www.youtube-nocookie.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self';" always;
    add_header Permissions-Policy "geolocation=(), microphone=(self), camera=()" always;

    location ^~ /.well-known/acme-challenge/ {
        allow all;
        default_type "text/plain";
        try_files $uri =404;
    }

    location = /.well-known/security.txt { return 404; }
    location ~* (^|/)\.(?!well-known) { access_log off; log_not_found off; return 404; }
    location ~* ^/(?:\.claude|\.vscode|node_modules)(?:/|$) { access_log off; log_not_found off; return 404; }
    location ~* ^/(?:package(?:-lock)?\.json|composer\.(?:json|lock)|docker-compose\.ya?ml)$ { access_log off; log_not_found off; return 404; }
    location ~* \.(?:db|sqlite3?|sh|py|pyc|env|log|bak|swp|pem|key|php)$ { access_log off; log_not_found off; return 404; }

    # RAG API (FastAPI on port 8001) — must precede the /api/ catch-all below.
    # /api/rag/upload, /api/rag/query, /api/rag/metrics
    location ^~ /api/rag/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        client_max_body_size 25M;   # allow PDF / docx uploads
    }

    # /api/eval/run, /api/eval/results
    location ^~ /api/eval/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Existing chat / auth / newsletter API (chat_server.py on port 8000).
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /rss.xml {
        proxy_pass http://127.0.0.1:8000/rss.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location @python {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        error_page 418 = @python;
        if (-f $document_root/maintenance.flag) {
            return 418;
        }
        try_files $uri $uri/ =404;
    }
}
